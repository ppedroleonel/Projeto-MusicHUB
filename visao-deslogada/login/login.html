<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MusicHUB</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/cadastro-login.css">

    <link rel="shortcut icon" href="../imgs/global/icone-camaleao.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <header class="cabecalho">
        <div class="cabecalho-esquerda">
        <a href="#">
            <img src="../imgs/global/logo.svg" alt="Logo do MusicHUB">
        </a>
        
        <span class="divisor"></span>
        
        <nav class="navegacao">
            <a href="#">Home</a>
            <a href="#" class="ativo">Playlists</a>
            <a href="#">Estatísticas</a>
        </nav>
    </div>

     <!-- Lado Direito -->
    <div class="cabecalho-direita">
        <span class="divisor"></span>

        <div class="botoes">
            <a class="btn-login" href="login.html">Login</a>
            <a class="btn-cadastrar" href="../cadastro/cadastro.html">Cadastrar-se</a>
        </div>
    </div>

    <!-- RESPONSIVIDADE (mantido da aula) -->
    <button class="botao-menu" id="menu">
        <i class="fa-solid fa-bars"></i>
    </button>
    </header>

    <main class="conteudo">
        <form>
            <section class = "conteudo-container">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input required type="email" id="email" placeholder="joaosilva@gmail.com">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input required type="password" id="senha" placeholder="********">
                        <button type="button" id="mostrar-senha" class="botao-olho">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="#F15D3A" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye icone-olho-aberto">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
                                </path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off preview-icon icone-olho-fechado"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
                        </button>
                    </div>
                    <div class="redefinir">
                        <p>Esqueceu a senha?</p>
                        <a>
                            <span>Redefinir</span>
                        </a>   
                    </div>

                </div>
                <button id="btn-enviar">Entrar</button>
                </section>
        </form>
    </main>

    <script src="login.js"></script>
</body>

</html>
