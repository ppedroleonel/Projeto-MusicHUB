<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists</title>
    
    <link rel="stylesheet" href="../playlists/playlists.css">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/imgs">

</head>
<body>
    <header class="cabecalho">
    <!-- Lado Esquerdo -->
    <div class="cabecalho-esquerda">
        <a href="#" class="logo">
            <img src="/imgs/global/logofooter.png" alt="Logo do site">
        </a>
        
        <span class="divisor"></span>
        
        <nav class="navegacao">
            <a href="#">Home</a>
            <a href="#" class="ativo">Playlists</a>
            <a href="#">Estatísticas</a>
        </nav>
    </div>

    <!-- Lado Direito -->
    <div class="cabecalho-direita">
        <button class="botao-busca">
            <img src="/imgs/conta/PESQUISA.png" alt="Ícone de busca">
        </button>
        
        <span class="divisor"></span>
        <div class="perfil">
            <span class="nome-usuario">Patrick</span>
            <img src="/imgs/global/login.png" alt="Foto de perfil" class="avatar">
        </div>
    </div>

    <!-- RESPONSIVIDADE (mantido da aula) -->
    <button class="botao-menu" id="menu">
        <i class="fa-solid fa-bars"></i>
    </button>
</header>
    
</body>
</html>
