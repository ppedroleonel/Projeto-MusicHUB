<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists</title>
    
    <link rel="stylesheet" href="../playlists/playlists.css">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/imgs">

</head>
<body>

<!-- HEADER LOGADO -->
    <header class="cabecalho">
    <!-- Lado Esquerdo -->
    <div class="cabecalho-esquerda">
        <a href="#" class="logo">
            <img src="/imgs/global/logofooter.png" alt="Logo do site">
        </a>
        
        <span class="divisor"></span>
        
        <nav class="navegacao">
            <a href="#">Home</a>
            <a href="#" class="ativo">Playlists</a>
            <a href="#">Estatísticas</a>
        </nav>
    </div>

    <!-- Lado Direito -->
    <div class="cabecalho-direita">
        <button class="botao-busca">
            <img src="/imgs/conta/PESQUISA.png" alt="Ícone de busca">
        </button>
        
        <span class="divisor"></span>
        <div class="perfil">
            <span class="nome-usuario">Patrick</span>
            <img src="/imgs/global/login.png" alt="Foto de perfil" class="avatar">
        </div>
    </div>

    <!-- RESPONSIVIDADE -->
    <button class="botao-menu" id="menu">
        <i class="fa-solid fa-bars"></i>
    </button>
</header>


<!-- CONTEÚDO PRINCIPAL -->

<main class="conteudo-principal">
    
    <!-- SUAS PLAYLISTS -->
    <section class="secao-playlists">
        <div class="cabecalho-secao">
            <h2 class="titulo-secao">Suas Playlists</h2>
            
            <button class="botao-criar">
                CRIAR<br>PLAYLIST <span class="icone-mais">+</span>
            </button>
        </div>

            <!-- SEÇÃO 1 -->
        <div class="grid-playlists">
            <!-- Card 1 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist1.png" alt="Capa Bob Marley">
            </div>
            
            <!-- Card 2 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist2.png" alt="Capa New Metal">
            </div>
            
            <!-- Card 3 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist3.png" alt="Capa Gangsta Rap">
            </div>

            <!-- Card 4 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist4.png" alt="Capa Best of Taylor Swift">
            </div>

            <!-- Card 5 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist5.png" alt="Capa Punk Classics">
            </div>
        </div>
    </section>

    <!-- SEÇÃO 2 -->
    <section class="secao-playlists">
        <div class="cabecalho-secao">
            <h2 class="titulo-secao">Playlists Recentes</h2>
        </div>

        <div class="grid-playlists">
            <!-- Card 1 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/recentes1.png" alt="Capa Bob Marley">
            </div>
            
            <!-- Card 2 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/recentes2.png" alt="Capa New Metal">
            </div>
            
            <!-- Card 3 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/recentes3.png" alt="Capa Gangsta Rap">
            </div>

            <!-- Card 4 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/recentes4.png" alt="Capa Best of Taylor Swift">
            </div>

            <!-- Card 5 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/recentes5.png" alt="Capa Punk Classics">
            </div>
        </div>
    </section>
    
    <!-- SEÇÃO 3 -->
    <section class="secao-playlists">
        <div class="cabecalho-secao">
            <h2 class="titulo-secao">Playlists Mais Ouvidas</h2>
        </div>

        <div class="grid-playlists">
            <!-- Card 1 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist1.png" alt="Capa Bob Marley">
            </div>
            
            <!-- Card 2 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist2.png" alt="Capa New Metal">
            </div>
            
            <!-- Card 3 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist3.png" alt="Capa Gangsta Rap">
            </div>

            <!-- Card 4 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist4.png" alt="Capa Best of Taylor Swift">
            </div>

            <!-- Card 5 -->
            <div class="card-playlist">
                <img src="/imgs/playlist/playlist5.png" alt="Capa Punk Classics">
            </div>
        </div>
    </section>

</main>

    
</body>
</html>
